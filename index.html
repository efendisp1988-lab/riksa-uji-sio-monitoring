<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIKSA UJI & SIO MONITORING | PT Kruing Lestari Jaya</title><style>
:root{--navy:#102b46;--blue:#2474a8;--bg:#f3f6fa;--line:#e2e9f0;--muted:#6b7b8c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#1b2b3b}button,input,select{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold}.primary{background:var(--blue);color:white}.soft{background:#eaf2f8;color:var(--navy)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0d263e,#1b557d);padding:20px}.box{background:white;border-radius:16px;padding:28px;width:min(420px,100%);box-shadow:0 20px 60px #0003}.box h2{color:var(--navy)}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{padding:11px;border:1px solid #ccd8e2;border-radius:8px;width:100%}.top{background:var(--navy);color:white;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1400px;margin:auto;padding:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button{background:white;color:var(--navy);border:1px solid var(--line)}.nav button.active{background:var(--navy);color:white}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:17px}.card b{display:block;font-size:27px;color:var(--navy);margin-top:8px}.panel{margin:14px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input,.toolbar select{padding:9px;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:12px}th{background:#f3f6f9}.table{overflow:auto}.muted{color:var(--muted);font-size:12px}.badge{padding:5px 8px;border-radius:20px;background:#edf1f4;font-size:11px}.green{background:#e7f6ed;color:#167447}.yellow{background:#fff6db;color:#956500}.red{background:#ffebec;color:#b4232b}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px}.modal .box{max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.wide{grid-column:1/-1}@media(max-width:750px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{padding:14px;font-size:12px}}
</style></head><body>
<div id="login" class="login"><div class="box"><h2>RIKSA UJI & SIO<br>MONITORING SYSTEM</h2><p>PT Kruing Lestari Jaya · Administrator</p><div id="setup" class="hidden"><p class="muted">Buat akun Admin pertama pada browser ini.</p><div class="field"><label>Username Admin</label><input id="newuser"></div><div class="field"><label>Password Admin</label><input id="newpass" type="password"></div><button class="primary" onclick="setupAdmin()">Buat Akun Admin</button></div><div id="signin"><div class="field"><label>Username</label><input id="user"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><button class="primary" onclick="loginNow()">Masuk</button></div><p id="msg" class="muted">Data tersimpan lokal di browser ini.</p></div></div>
<div id="app" class="hidden"><header class="top"><b>RIKSA UJI & SIO MONITORING SYSTEM<br><small>PT Kruing Lestari Jaya</small></b><button onclick="logout()">Keluar</button></header><main class="wrap"><div class="nav"><button class="active" onclick="page='home';render()">Dashboard Utama</button><button onclick="page='riksa';render()">Monitoring Riksa Uji</button><button onclick="page='sio';render()">SIO & Lisensi K3</button><button onclick="form()">＋ Input Data</button><button onclick="backup()">Backup</button><button onclick="restore()">Restore</button></div><div id="content"></div></main></div><div id="modal"></div>
<script>
const K='klj_riksa_sio_trial';let db=JSON.parse(localStorage.getItem(K)||'{"riksa":[],"sio":[]}'),page='home';const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(db))}function init(){if(!localStorage.getItem('klj_admin')){$('setup').classList.remove('hidden');$('signin').classList.add('hidden')}}function setupAdmin(){let u=$('newuser').value,p=$('newpass').value;if(!u||p.length<6)return alert('Isi username dan password minimal 6 karakter.');localStorage.setItem('klj_admin',JSON.stringify({u,p}));$('setup').classList.add('hidden');$('signin').classList.remove('hidden');$('msg').textContent='Akun Admin dibuat. Silakan masuk.'}function loginNow(){let a=JSON.parse(localStorage.getItem('klj_admin')||'null');if(a&&$('user').value===a.u&&$('pass').value===a.p){$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}else $('msg').textContent='Username atau password tidak sesuai.'}function logout(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}function status(d){if(!d)return'Belum diisi';let n=(new Date(d+'T00:00:00')-new Date())/86400000;if(n<0)return'Kedaluwarsa';if(n<=30)return'≤30 hari';if(n<=60)return'≤60 hari';return'Berlaku'}function cls(s){return s==='Berlaku'?'green':s==='Kedaluwarsa'?'red':s==='≤30 hari'||s==='≤60 hari'?'yellow':''}function render(){let all=[...db.riksa,...db.sio],expired=all.filter(x=>status(x.due)==='Kedaluwarsa').length,near=all.filter(x=>['≤30 hari','≤60 hari'].includes(status(x.due))).length;if(page==='home'){$('content').innerHTML='<h2>Dashboard Utama</h2><p class="muted">Ringkasan monitoring peralatan dan kompetensi K3.</p><div class="cards">'+[['Total Riksa Uji',db.riksa.length],['Total SIO / Lisensi',db.sio.length],['Mendekati jatuh tempo',near],['Kedaluwarsa',expired]].map(x=>'<div class="card">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><div class="panel"><h3>Monitoring Terpisah</h3><p>Riksa Uji: '+db.riksa.length+' data · SIO & Lisensi: '+db.sio.length+' data</p><p class="muted">Gunakan menu di atas untuk membuka masing-masing dashboard.</p></div>'}else{let arr=db[page],title=page==='riksa'?'Monitoring Riksa Uji':'Monitoring SIO & Lisensi K3';$('content').innerHTML='<h2>'+title+'</h2><div class="toolbar"><input id="search" placeholder="Cari nama, nomor, lokasi..." oninput="filter()"><button class="primary" onclick="form()">＋ Tambah Data</button><button class="soft" onclick="csv()">Ekspor CSV</button><button class="soft" onclick="print()">Cetak / PDF</button></div><div id="rows">'+table(arr)+'</div>'}}function table(a){if(!a.length)return'<div class="panel muted">Belum ada data. Tambahkan data secara manual untuk memulai trial.</div>';return'<div class="panel table"><table><thead><tr><th>Nama / Identitas</th><th>Kategori</th><th>Lokasi</th><th>Nomor</th><th>Jatuh Tempo</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.cat)+'</td><td>'+esc(x.loc)+'</td><td>'+esc(x.no)+'</td><td>'+esc(x.due)+'</td><td><span class="badge '+cls(status(x.due))+'">'+status(x.due)+'</span></td><td><button class="soft" onclick="edit(\''+x.id+'\')">Edit</button> <button onclick="del(\''+x.id+'\')">Hapus</button></td></tr>').join('')+'</tbody></table></div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filter(){let q=$('search').value.toLowerCase();$('rows').innerHTML=table(db[page].filter(x=>[x.name,x.cat,x.loc,x.no].join(' ').toLowerCase().includes(q)))}function form(id){let x=id?db[page].find(z=>z.id===id):{};$('modal').innerHTML='<div class="modal"><div class="box"><h3>Input '+(page==='riksa'?'Riksa Uji':'SIO / Lisensi K3')+'</h3><form onsubmit="saveForm(event,\''+(id||'')+'\')"><div class="grid"><div class="field"><label>Nama / Identitas</label><input name="name" required value="'+esc(x.name)+'"></div><div class="field"><label>Kategori</label><input name="cat" required value="'+esc(x.cat)+'" placeholder="'+(page==='riksa'?'Alat Berat / Mesin / Tangki / Bejana':'Jenis SIO / Lisensi')+'"></div><div class="field"><label>Lokasi / Estate</label><input name="loc" value="'+esc(x.loc)+'"></div><div class="field"><label>Nomor Unit / Lisensi / Sertifikat</label><input name="no" value="'+esc(x.no)+'"></div><div class="field"><label>Tanggal Terbit / Pemeriksaan</label><input name="issued" type="date" value="'+esc(x.issued)+'"></div><div class="field"><label>Tanggal Jatuh Tempo</label><input name="due" type="date" value="'+esc(x.due)+'"></div><div class="field wide"><label>Keterangan</label><input name="notes" value="'+esc(x.notes)+'"></div></div><button class="primary">Simpan</button> <button type="button" onclick="$(\'modal\').innerHTML=\'\'">Batal</button></form></div></div>'}function saveForm(e,id){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=id||Date.now().toString();let i=db[page].findIndex(x=>x.id===o.id);if(i>=0)db[page][i]=o;else db[page].push(o);save();$('modal').innerHTML='';render()}function edit(id){form(id)}function del(id){if(confirm('Hapus data ini?')){db[page]=db[page].filter(x=>x.id!==id);save();render()}}function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.href=u;a.download='backup_riksa_sio.json';a.click();URL.revokeObjectURL(u)}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.riksa)||!Array.isArray(x.sio))throw 0;db=x;save();render()}catch(e){alert('File backup tidak valid')}};r.readAsText(i.files[0])};i.click()}function csv(){let cols=['name','cat','loc','no','issued','due','notes'],a=[cols.join(','),...db[page].map(x=>cols.map(k=>'"'+String(x[k]||'').replace(/"/g,'""')+'"').join(','))].join('\r\n'),u=URL.createObjectURL(new Blob([a],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download=page+'_monitoring.csv';l.click();URL.revokeObjectURL(u)}init();
</script></body></html>
